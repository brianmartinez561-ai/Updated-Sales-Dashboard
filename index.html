<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quintile Dashboard Glass</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&family=Inter:wght@400;500;600&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style id="css">
/* VOICE: clinical, like a newspaper graphics desk - black ink on white paper
   IDEA: a printed league table / ranking sheet for a district
   PICTURE: a rank strip from 1 to the last store, cut into five quintile bands, every store pinned on it
   COLOUR and TYPE: royal blue brand on cool white; quintiles run green (Q1) to amber to red (Q5); Inter Tight + Inter
   LAYOUT: sticky top bar with tabs + filters, finding as title, strip, cards, tables */

/* ---------- 1. Theme colours ---------- */
:root{color-scheme:light dark;--bg:light-dark(#e6e9f0,#0a0d18);--card:light-dark(#fff,#151b2e);--ink:light-dark(#141a2e,#eef1f8);--mut:light-dark(#5d6680,#9aa3bd);--line:light-dark(#e2e6f0,#262e48);--soft:light-dark(#eef1f8,#1c2338);--mid:light-dark(#c3c9da,#3a4466);
 --brand:light-dark(#2f4fd8,#7d93ff);--brand-ink:light-dark(#fff,#0d1120);--brand-soft:light-dark(#e6ebff,#222c55);
 --q1:light-dark(#12805c,#37c48f);--q2:light-dark(#3ba776,#6fd3a2);--q3:light-dark(#d4940f,#f2bd45);--q4:light-dark(#e2672a,#ff9a5e);--q5:light-dark(#cf3b4d,#ff6b7c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mut{color:var(--mut)}.small{font-size:13px}
a{color:inherit}

/* ---------- 2. Top navigation ---------- */
.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(20,30,70,.25);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px max(4vw,14px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px "Inter Tight",sans-serif}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--q1),var(--brand) 55%,var(--q5));color:#fff;display:grid;place-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{text-decoration:none;padding:10px 12px;border-radius:999px;font-weight:600;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.tabs a{color:var(--mut)}.tabs a:hover{color:var(--ink);background:var(--soft)}
.tabs a[aria-current=page]{background:var(--brand-soft);color:var(--brand)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-inline-start:auto}
.sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
#fStore{max-width:210px}
.status{font-size:13px;color:var(--mut);padding-inline-start:6px;white-space:nowrap}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--q1);margin-inline-end:6px}
.status.busy::before{background:var(--q3)}

/* ---------- 3. Form controls ---------- */
select,input,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--mid);border-radius:10px;min-height:44px;padding:8px 12px}
textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,monospace}
input[type=range]{accent-color:var(--brand);border:0;padding:0;width:100%}
input[type=number]{width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--brand);border-radius:999px;background:var(--card);color:var(--brand);font:600 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:hover{box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- 4. Layout pieces ---------- */
main{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,14px) 80px}
.view{display:none}.view.on{display:block}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sec{margin-top:40px}.sec>h2{margin-bottom:6px}.sec>.mut{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{border:1px solid light-dark(#dde1ea,#262e48);border-radius:14px;padding:18px;background:var(--card);box-shadow:0 1px 3px rgba(20,30,70,.08),0 6px 16px -10px rgba(20,30,70,.18)}
.card.click{cursor:pointer;transition:border-color .15s}.card.click:hover{border-color:var(--brand);box-shadow:0 8px 24px -14px rgba(47,79,216,.5)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.kpi .card b{color:var(--brand);display:block;font:800 clamp(28px,4vw,38px)/1.1 "Inter Tight",sans-serif;margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--mid);border-radius:999px;padding:8px 14px;min-height:44px;background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.empty{border:1px dashed var(--mid);border-radius:14px;padding:32px;text-align:center;color:var(--mut)}

/* ---------- 5. Quintile badges: Q1 green -> Q5 red ---------- */
.qb{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:8px;font:800 14px "Inter Tight",sans-serif;white-space:nowrap;color:#fff}
.q1{background:var(--q1)}.q2{background:var(--q2)}.q3{background:var(--q3)}.q4{background:var(--q4)}.q5{background:var(--q5)}
:root[data-theme=dark] .qb{color:#0d1120}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .qb{color:#0d1120}}
.qb.big{height:56px;min-width:64px;font-size:26px;border-radius:12px}

/* ---------- 6. Metric bars, tables, charts ---------- */
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.mrow span:nth-child(n+2){text-align:right}
.tag{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;vertical-align:bottom;white-space:normal;min-width:84px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
thead th{background:var(--soft)}
td small{display:block;font-size:12px;opacity:.75}
tr.click{cursor:pointer}tr.click:hover td:first-child{text-decoration:underline}
.fig{position:relative;min-height:200px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{fill:var(--ink);font:12px Inter,sans-serif}
.pos{font-weight:600;color:var(--q1)}.neg{font-weight:600;color:var(--q5)}

/* ---------- 7. Planner + what-if ---------- */
.plan td:first-child{font-weight:600}
.wi{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.wirow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wirow label{font-weight:600;font-size:14px}
.wirow{transition:background .2s}
.wirow.chg{background:var(--brand-soft);border-radius:10px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent;box-shadow:inset 4px 0 0 var(--brand)}
.wirow .mv{display:block;font-size:12px;color:var(--brand);font-weight:700}
.wirow.chg + .wirow{border-top-color:transparent}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.tcard{display:grid;gap:10px;transition:box-shadow .2s}
.tcard.up{box-shadow:inset 4px 0 0 var(--q1)}.tcard.down{box-shadow:inset 4px 0 0 var(--q5)}
.tcard .trow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center}
.tcard input[type=number]{min-height:38px;padding:4px 8px;text-align:right}
.tout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tout div{background:var(--soft);border-radius:10px;padding:8px 10px}
.tout span{display:block;font-size:12px;color:var(--mut)}.tout b{font-size:18px}
.twi{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tsum{position:sticky;top:90px;display:grid;gap:12px}
.tsum .big{font:800 clamp(40px,6vw,56px)/1 "Inter Tight",sans-serif;color:var(--brand)}
@media(max-width:900px){.twi{grid-template-columns:minmax(0,1fr)}.tsum{position:static}}
.wisrc{display:flex;align-items:center;gap:8px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--soft);margin-bottom:6px}
.wisrc.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.plan td.hl{background:var(--brand-soft);color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.plan td.hl small{opacity:1;font-weight:600}
.wirow input[type=number]{min-height:38px;padding:4px 8px;text-align:right}
.wirow .r{font-size:13px;text-align:right;white-space:nowrap}
.result{position:sticky;top:150px;text-align:center}
.result{background:linear-gradient(180deg,var(--brand-soft),var(--card) 70%)}
.result b{color:var(--brand);display:block;font:800 clamp(48px,8vw,72px)/1 "Inter Tight",sans-serif;margin:8px 0}
.drop{border:2px dashed var(--mid);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer}
.drop{background:var(--soft)}.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop input{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--brand);color:var(--brand-ink);padding:12px 18px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);transition:transform .25s;z-index:50;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- 7b. Sales gaps tab ---------- */
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;align-items:start}
.ctl .lbl{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.gtbl td{vertical-align:middle;white-space:normal}
.gtbl td:first-child{min-width:170px;max-width:230px}
.gtbl td:nth-child(n+2){min-width:96px}
.gtbl td .tag{display:inline-block;margin:2px 0 0}
.gtbl tr.need td{background:color-mix(in srgb,var(--brand-soft) 65%,var(--card))}
.gtbl tr.need td:first-child{box-shadow:inset 4px 0 0 var(--brand)}
.gtbl input{width:112px;min-height:38px;padding:4px 8px;text-align:right}
.gtbl .tag{margin-inline-start:6px}
.att{display:flex;align-items:center;gap:8px;min-width:120px}.att .bar{flex:1;margin:0;height:8px}
.att b{width:56px;text-align:right}
.needt{font-weight:700;color:var(--brand)}
.dlist{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px;font-size:14px}.dlist li{display:flex;gap:8px;align-items:center}
.days tr.today td{background:var(--brand-soft)}.days tr.today td:first-child{box-shadow:inset 4px 0 0 var(--brand)}.days tr.past td{color:var(--mut)}
.mx tbody tr{cursor:pointer}
.tsrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.tsrow .btn{min-height:36px;width:44px;padding:0;flex:none}
.topscroll{flex:1;overflow-x:auto;overflow-y:hidden;height:16px;border-radius:8px;background:var(--soft);scrollbar-width:auto;scrollbar-color:var(--mid) var(--soft)}
.topscroll>div{height:1px}
.tsrow+.scroll{margin-top:6px!important}
.topscroll::-webkit-scrollbar,.scroll::-webkit-scrollbar{height:12px}
.topscroll::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--mid);border-radius:6px;border:3px solid var(--card)}
.topscroll::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:var(--soft)}.mx tbody tr:hover td:first-child{text-decoration:underline}
.mx tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--brand);background:var(--brand-soft)}
.mx th,.mx td{padding:8px 8px;min-width:78px}
.mx th{white-space:normal;font-size:12px;line-height:1.25}
.mx td:first-child,.mx th:first-child{min-width:150px;max-width:190px;white-space:normal}
.mx td{font-weight:600}.mx td small{font-weight:600}

/* ---------- 8. Sign-in screen + view-only notice ---------- */
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px}
.login[hidden]{display:none}
.login form{width:min(100%,380px);display:grid;gap:14px;text-align:center;padding:28px}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mut)}
.remember input{min-height:0;width:18px;height:18px;accent-color:var(--brand)}
.notice{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--brand-soft);border-color:var(--brand-soft);margin-bottom:18px}
:disabled{opacity:.5;cursor:not-allowed}

/* ---------- 9. Small screens ---------- */
@media(max-width:860px){.wi{grid-template-columns:minmax(0,1fr)}.result{position:static}}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}.filters{margin-inline-start:0;width:100%}.sel{flex:1 1 140px}.sel select{width:100%}
 .wirow{grid-template-columns:minmax(0,1fr) 92px;}.wirow input[type=range]{grid-column:1/-1;order:3}.wirow .r{grid-column:1/-1;order:4;text-align:left}}

/* ================= GLASS THEME =================
   Frosted, see-through panels floating over soft colour light.
   Only colours and surfaces change here; layout and logic are the same as the standard dashboard. */
:root{
 --bg:light-dark(#e9eefb,#070b1a);
 --card:light-dark(rgba(255,255,255,.52),rgba(22,28,52,.48));
 --soft:light-dark(rgba(255,255,255,.42),rgba(255,255,255,.07));
 --line:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.12));
 --mid:light-dark(rgba(20,30,70,.22),rgba(255,255,255,.22));
 --ink:light-dark(#101633,#f1f4ff);
 --mut:light-dark(#4b5578,#a9b2d4);
 --brand:light-dark(#3b55e6,#8fa2ff);
 --brand-soft:light-dark(rgba(59,85,230,.14),rgba(143,162,255,.18));
 --glass-edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.16));
 --glass-shadow:light-dark(0 10px 30px -12px rgba(30,45,110,.28),0 14px 34px -14px rgba(0,0,0,.7));
 --blur:blur(22px) saturate(170%);
}
/* the light behind the glass: fixed so it stays put while the page scrolls */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-10vmax;z-index:-1;pointer-events:none;
 background:
  radial-gradient(38vmax 38vmax at 12% 8%,light-dark(rgba(99,128,255,.55),rgba(70,92,255,.45)),transparent 70%),
  radial-gradient(34vmax 34vmax at 88% 14%,light-dark(rgba(255,120,190,.42),rgba(200,60,160,.35)),transparent 70%),
  radial-gradient(40vmax 40vmax at 78% 82%,light-dark(rgba(60,210,190,.45),rgba(20,160,150,.35)),transparent 70%),
  radial-gradient(30vmax 30vmax at 18% 88%,light-dark(rgba(255,196,90,.42),rgba(220,140,40,.28)),transparent 70%);
 filter:blur(10px)}
@media (prefers-reduced-motion:no-preference){body::before{animation:drift 40s ease-in-out infinite alternate}}
@keyframes drift{to{transform:translate3d(3vmax,-2vmax,0) scale(1.06)}}

/* frosted surfaces */
.card,.nav,.toast,.login form,.tsrow .btn{
 background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 light-dark(rgba(255,255,255,.85),rgba(255,255,255,.08))}
.card{border-radius:20px}
.card.click:hover{border-color:var(--brand);box-shadow:var(--glass-shadow),0 0 0 3px var(--brand-soft)}
.nav{border-width:0 0 1px;border-radius:0}
.logo{box-shadow:0 6px 16px -6px rgba(59,85,230,.7)}
.tabs a:hover{background:var(--soft)}
.tabs a[aria-current=page]{background:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.14));color:var(--brand);box-shadow:inset 0 0 0 1px var(--glass-edge),0 4px 14px -8px rgba(30,45,110,.5)}
.result{background:linear-gradient(180deg,var(--brand-soft),var(--card) 75%)}
.kpi .card b,.result b{background:linear-gradient(120deg,var(--brand),light-dark(#8a4dff,#c79bff));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .card b .qb{-webkit-text-fill-color:initial}

/* controls look like glass too */
select,input,textarea{background:light-dark(rgba(255,255,255,.6),rgba(255,255,255,.06));border-color:var(--glass-edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip,.btn{background:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.06));border-color:var(--glass-edge);color:var(--ink)}
.btn{color:var(--brand)}
.chip[aria-pressed=true],.btn.solid{background:linear-gradient(135deg,var(--brand),light-dark(#7b5cff,#a98bff));border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px rgba(59,85,230,.8)}
.tag{background:var(--brand-soft);border-color:transparent}
.drop{background:light-dark(rgba(255,255,255,.35),rgba(255,255,255,.04));border-color:var(--mid)}
.empty{background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* quintile badges: glossy */
.qb{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px -6px rgba(0,0,0,.45)}

/* tables: header and sticky first column stay readable over scrolled content */
thead th{background:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.06))}
th:first-child,td:first-child{background:light-dark(rgba(246,248,255,.92),rgba(18,23,44,.92));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
td{border-bottom-color:var(--line)}
.gtbl tr.need td{background:light-dark(rgba(59,85,230,.10),rgba(143,162,255,.12))}
.gtbl tr.need td:first-child{background:light-dark(rgba(232,236,255,.95),rgba(30,38,78,.95))}
.mx tr.cur td:first-child{background:light-dark(rgba(232,236,255,.95),rgba(30,38,78,.95))}
.days tr.today td{background:var(--brand-soft)}
.bar{background:light-dark(rgba(20,30,70,.08),rgba(255,255,255,.08))}
.topscroll{background:light-dark(rgba(255,255,255,.4),rgba(255,255,255,.06))}
.toast{color:var(--ink)}
.wisrc.on{background:linear-gradient(135deg,var(--brand),light-dark(#7b5cff,#a98bff))}
/* browsers without backdrop blur get more solid panels so text stays readable */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 :root{--card:light-dark(rgba(255,255,255,.9),rgba(22,28,52,.92))}}
/* Netlify sign-in screen: frosted over the coloured light */
.login{background:light-dark(rgba(233,238,251,.55),rgba(7,11,26,.6));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
</style></head><body><div id="app">
<header class="nav">
  <a class="brand" href="#overview"><span class="logo">Q</span><span>Quintile</span></a>
  <nav class="tabs" aria-label="Sections">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#store" data-tab="store">My store</a>
    <a href="#gaps" data-tab="gaps">Sales gaps</a>
    <a href="#today" data-tab="today">Today</a>
    <a href="#data" data-tab="data">Load data</a>
  </nav>
  <div class="filters">
    <label class="sel">Month <select id="fMonth"></select></label>
    <label class="sel">Store <select id="fStore"></select></label>
    <span class="status" id="status">Ready</span>
    <button class="btn sm" id="acct" type="button" hidden>Sign in to edit</button>
  </div>
</header>
<main>
  <div class="empty" id="boot" style="max-width:420px;margin:40px auto">Loading dashboard…</div>

{
/* =====================================================================
   QUINTILE DASHBOARD - all the logic lives in this one script.
   Sections: 1 config, 2 saved data, 3 helpers, 4 prediction model,
   5 Excel/paste import, 6 overview, 7 store view, 8 data view, 9 start-up + sign-in
   ===================================================================== */

/* ---------- 1. CONFIG: the 8 metrics, matching the Excel export columns ---------- */
// fmt "pct" = shown as %, "num" = plain number (CSAT is out of 10)
// val / rank = possible column headers (lower-case, letters+digits only)
const METRICS = [
  {k:'gp',    label:'GP Per Hour',        fmt:'pct', val:['gpperlaborhourtgt','gpperhourtgt','gpperhour'], rank:['gpperlaborhourrank','gpperhourrank']},
  {k:'pp',    label:'Postpaid Pct Tgt',   fmt:'pct', val:['ppacttgt','postpaidpcttgt'],               rank:['ppactattainrank','ppactrank','postpaidrank']},
  {k:'rebiz', label:'Rebiz Conversion',   fmt:'pct', val:['rebizconvtgt','rebizconversion'],         rank:['rebizconvrank','rebizconversionrank']},
  {k:'acc',   label:'Acc Pct Tgt',        fmt:'pct', val:['accgppctactual','accpcttgt','accgppcttgt'], rank:['accgppctrank','accpctrank']},
  {k:'csat',  label:'CSAT',               fmt:'num', val:['csatactual','csat'],                       rank:['csatrank']},
  {k:'ban',   label:'New BAN Attainment', fmt:'pct', val:['newbanattainment'],                        rank:['newbanrank','newbanattainmentrank']},
  {k:'p360',  label:'P360 Attach Rate',   fmt:'pct', val:['p360attachratetgt','p360attachrate'],     rank:['p360attachraterank']},
  {k:'prem',  label:'Premium Rate Plan Mix', fmt:'pct', val:['premiummixratetgt','premiumrateplanmix'], rank:['premiumrateplanrank','premiummixraterank']}
];
const KEY = 'quintile-dashboard-data', UIKEY = 'quintile-dashboard-ui';

/* ---------- 2. SAVED DATA: one shared copy on Netlify + a cached copy on this device ----------
   The server keeps the shared copy at /api/data (see netlify/functions/data.mjs).
   EDIT_PASSWORD lets people load data and change settings; VIEW_PASSWORD (optional) is needed just to look.
   If the server can't be reached (e.g. you opened index.html straight from your computer),
   the dashboard still works and saves on this device only. */
const SEED = JSON.parse(document.getElementById('seed').textContent); // fictional demo data, shown until real data is saved
let S = SEED;
try { const local = JSON.parse(localStorage.getItem(KEY) || 'null'); if (local && local.rows) S = local; } catch (e) {}
let ui = {month:'', store:'', target:null, qf:0, sort:'rank'};
try { Object.assign(ui, JSON.parse(localStorage.getItem(UIKEY) || '{}')); } catch (e) {}
let whatif = null;          // what-if slider values for the open store
let role = 'edit';          // what the current password allows: 'edit' or 'view'
let online = false;         // true once the Netlify server has answered
let serverUpdated = null;   // version of the shared copy we last loaded or saved
let saveTimer, saving = false, saveAgain = false, wantEdit = false;

const PWKEY = 'quintile-dashboard-pw';
const getPw = () => { try { return sessionStorage.getItem(PWKEY) || localStorage.getItem(PWKEY) || ''; } catch (e) { return ''; } };
function setPw(pw, remember){
  try { sessionStorage.removeItem(PWKEY); localStorage.removeItem(PWKEY); if (pw) (remember ? localStorage : sessionStorage).setItem(PWKEY, pw); } catch (e) {}
}
const api = (method, body) => fetch('/api/data', {method, cache: 'no-store', body: body && JSON.stringify(body),
  headers: {'content-type': 'application/json', 'x-dashboard-password': getPw()}});
const cacheLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const canEdit = () => !online || role === 'edit';

function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify({month:ui.month, store:ui.store, sort:ui.sort})); } catch (e) {} }

// Call commit() after ANY data/settings change: caches here, then saves to the server for everyone
function commit(msg){
  if (!canEdit()) { toast('View only. Sign in with the edit password to make changes.'); render(); return; }
  S.updated = Date.now(); cacheLocal();
  if (msg) toast(msg);
  if (online) { setStatus('Saving…', true); clearTimeout(saveTimer); saveTimer = setTimeout(pushSave, 800); }
  else setStatus('Offline - saved on this device', true);
  render();
}
async function pushSave(){
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const r = await api('PUT', {base: serverUpdated, data: S});
    const j = await r.json().catch(() => ({}));
    if (r.ok) { serverUpdated = S.updated = j.updated; cacheLocal(); setStatus('Saved for everyone'); }
    else if (r.status === 409) { S = j.data; serverUpdated = j.data.updated; cacheLocal(); render();
      toast('Someone else saved first. Their version is loaded - please redo your last change.'); setStatus('Saved for everyone'); }
    else if (r.status === 401 || r.status === 403) { role = 'view'; updateAcct(); setStatus('View only', true); wantEdit = true;
      showLogin('Your change was not saved: the edit password was not accepted.', true); }
    else setStatus('Not saved - ' + (j.message || 'server error'), true);
  } catch (e) { setStatus('Offline - saved on this device', true); }
  saving = false;
  if (saveAgain) { saveAgain = false; pushSave(); }
}

// Connect to the server: check the password and load the shared data
async function boot(){
  setStatus('Connecting…', true);
  try {
    const r = await api('GET');
    if (r.status === 401) { online = true; role = 'view'; updateAcct(); setStatus('Signed out', true);
      showLogin(getPw() ? 'That password did not work. Try again.' : 'Enter the dashboard password.', false); return; }
    if (!r.ok) throw new Error('no server');
    const j = await r.json();
    online = true; role = j.role === 'edit' ? 'edit' : 'view';
    if (j.data && j.data.rows) { S = j.data; serverUpdated = j.data.updated; } else { S = SEED; serverUpdated = null; }
    cacheLocal(); hideLogin();
    if (wantEdit && role !== 'edit') { showLogin('That is not the edit password. You can keep viewing, or try again.', true); }
    else wantEdit = false;
    setStatus(role === 'edit' ? (serverUpdated ? 'Saved for everyone' : 'Demo data - load yours') : 'View only', role !== 'edit');
    if (role === 'edit' && !j.editConfigured) toast('EDIT_PASSWORD is not set on Netlify yet, so changes cannot be saved.');
  } catch (e) { online = false; role = 'edit'; setStatus('Offline - saved on this device', true); }
  updateAcct(); render();
}

// Sign-in screen
function showLogin(msg, cancellable){
  $('loginMsg').textContent = msg; $('loginCancel').hidden = !cancellable; $('login').hidden = false;
  $('pw').value = ''; setTimeout(() => $('pw').focus(), 50);
}
function hideLogin(){ $('login').hidden = true; }
function updateAcct(){
  const b = $('acct'); b.hidden = !online;
  b.textContent = role === 'edit' ? 'Sign out' : 'Sign in to edit';
}

/* ---------- 3. HELPERS ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = () => +S.settings.total || 334;
const W = k => (+S.settings.weights[k] || 0) / 100;
const fmt = (m, v) => !isFinite(v) ? '-' : m.fmt === 'num' ? v.toFixed(2) : (v * 100).toFixed(1) + '%';
const fmtD = (m, d) => (d >= 0 ? '+' : '') + (m.fmt === 'num' ? d.toFixed(2) : (d * 100).toFixed(1) + ' pts');
const mk = s => { s = String(s); let a = s.match(/(\d{1,2})\D+(\d{4})/); if (a) return +a[2] * 100 + +a[1];
                  a = s.match(/(\d{4})\D+(\d{1,2})/); return a ? +a[1] * 100 + +a[2] : 0; };
const months = () => [...new Set(S.rows.map(r => r.month))].sort((a, b) => mk(b) - mk(a));
const rowsFor = m => S.rows.filter(r => r.month === m).sort((a, b) => a.rank - b.rank);
const quint = rank => { const i = S.settings.quint.findIndex(q => rank <= +q[1]); return i < 0 ? 5 : i + 1; };
const qc = q => `var(--q${q})`;
const qb = (q, big) => `<span class="qb q${q}${big ? ' big' : ''}">Q${q}</span>`;
const clampR = r => Math.min(N(), Math.max(1, r));
const ranksOf = r => Object.fromEntries(METRICS.map(m => [m.k, r.m[m.k][1]]));
const valsOf = r => Object.fromEntries(METRICS.map(m => [m.k, r.m[m.k][0]]));
const scoreFrom = ranks => METRICS.reduce((s, m) => s + W(m.k) * ranks[m.k], 0);
const score = r => scoreFrom(ranksOf(r));
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
function setStatus(t, busy){ const el = $('status'); el.textContent = t; el.classList.toggle('busy', !!busy); }
function prevRow(r){ const ms = months(), i = ms.indexOf(r.month); return i < 0 ? null : S.rows.find(x => x.id === r.id && x.month === ms[i + 1]) || null; }

/* ---------- 4. PREDICTION MODEL ----------
   The overall rank is driven by a weighted score: sum(weight x metric rank). Lower = better.
   From the loaded stores we learn two curves:
     metric value -> metric rank   (e.g. 95% GP/hr ~ rank 60)

const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');

  const col = {month: or(find(['month', 'monthyear']), 0), store: or(H.findIndex(h => /loaction|location|store|site/.test(h)), 1),

/* ---------- 10. SALES GAPS TAB ----------
   Reads the month-to-date sales report (actuals vs targets) and works out, for each store,
   how far each metric is from the goal you choose and what it takes to close the gap.
   kind "tgt"  = actual vs target from the report (gap = goal - actual)
   kind "rate" = numerator / denominator (gap = extra numerator needed at today's traffic)
   q           = the matching quintile metric, so goals can come from the quintile planner.
                 Only 6 sales metrics feed the quintile: postpaid pct target (voice + BTS), Rebiz conversion,
                 accessory % to target, new postpaid accounts, P360 attach and premium plan mix.
   a / t / n can be one column or a list of columns that are added together. */
const SALES = [
  {k:'gp',    label:'Net GP (trend)',            kind:'tgt',  a:'netgptrend',               t:'netgptarget',                u:'$', trend:true, mt:['gptarget']},
  {k:'pp',    label:'Postpaid pct target (voice + BTS)', kind:'tgt', a:['netpostpaidvoiceacts', 'netpostpaidbtsacts'], t:['netpostpaidvoicetarget', 'netpostpaidbtstarget'], u:'#', q:'pp', parts:['voice', 'BTS'], mt:['netpostpaidvoice', 'netpostpaidbts']},
  {k:'bans',  label:'New postpaid accounts',     kind:'tgt',  a:'newpostpaidaccounts',      t:'newpostpaidaccountstarget',  u:'#', q:'ban'},
  {k:'acc',   label:'Accessory GP',              kind:'tgt',  a:'accessorygp',              t:'accessorygptarget',          u:'$', q:'acc', mt:['accessorygptarget']},
  {k:'hsi',   label:'Net HSI',                   kind:'tgt',  a:'nethsiacts',               t:'nethsitarget',               u:'#', mt:['nethsitarget']},
  {k:'bb',    label:'Net broadband',             kind:'tgt',  a:'netbroadbandacts',         t:'netbroadbandactstarget',     u:'#'},
  {k:'vaf',   label:'Value added features',      kind:'tgt',  a:'valueaddedfeaturesactual', t:'valueaddedfeaturestarget',   u:'n'},
  {k:'prem',  label:'Premium rate plan mix',     kind:'rate', n:'premiumlines',     d:'newlines',             unit:'premium lines', q:'prem', rt:0.80},
  {k:'conv',  label:'Rebiz conversion (acts + upgrades)', kind:'rate', n:['rebizacts', 'rebizupgrades'], d:'rebiztraffic', unit:'Rebiz acts or upgrades', q:'rebiz', parts:['acts', 'upgrades'], rt:0.19},
  {k:'prio',  label:'Visa priority',             kind:'rate', n:'priorityvisaapps', d:'priorityinteractions', unit:'Visa priority apps', rt:0.09},
  {k:'p360',  label:'Indexed P360',              kind:'rate', v:'indexedp360', q:'p360', rt:0.40}
];
// numerator total: one column, or several added together (Rebiz acts + Rebiz upgrades)
const sumk = (v, keys) => [].concat(keys).reduce((s, k) => s + (+v[k] || 0), 0);
const nsum = (v, m) => sumk(v, m.n);
const sval = (v, m) => m.kind === 'tgt' ? sumk(v, m.a) : m.v ? +v[m.v] : (+v[m.d] > 0 ? nsum(v, m) / +v[m.d] : NaN);
// for combined rates, the split shown under the number, e.g. "10.6% acts + 2.7% upgrades"
const split = (v, m) => !m.parts ? '' : m.kind === 'tgt'
  ? m.a.map((k, i) => `${Math.round((+v[k] || 0) * 10) / 10} ${m.parts[i]}`).join(' + ')
  : +v[m.d] > 0 ? m.n.map((k, i) => `${((+v[k] || 0) / +v[m.d] * 100).toFixed(1)}% ${m.parts[i]}`).join(' + ') : '';
// rt = the all-store target for a rate (editable on the Sales gaps tab, saved in S.rtgt)
const rateTgt = m => S.rtgt && isFinite(S.rtgt[m.k]) ? +S.rtgt[m.k] : m.rt;
const sbase = (row, m) => m.kind === 'tgt' ? sumk(row.v, m.t) : isFinite(rateTgt(m)) ? rateTgt(m) : sval(S.sales.district || {}, m);
const attQ = p => !isFinite(p) ? 3 : p >= 1 ? 1 : p >= .95 ? 2 : p >= .85 ? 3 : p >= .7 ? 4 : 5;
const pctTxt = p => isFinite(p) ? Math.round(p * 100) + '%' : '-';
function sfmt(m, v){
  if (!isFinite(v)) return '-';
  if (m.kind === 'rate') return (v * 100).toFixed(1) + '%';
  if (m.u === '$') return '$' + Math.round(v).toLocaleString();
  if (m.u === 'n') return v.toFixed(1);
  return (Math.round(v * 10) / 10).toLocaleString();
}
function sneed(g){
  const m = g.m; if (!g.short || !(g.units > 1e-6)) return '';
  if (m.kind === 'rate') return m.n ? `${Math.ceil(g.units)} more ${m.unit} by month end` : `+${(g.units * 100).toFixed(1)} pts`;
  if (m.u === '$') return '$' + Math.round(g.units).toLocaleString() + ' more';
  if (m.u === 'n') return '+' + g.units.toFixed(1);
  return Math.ceil(g.units) + ' more';
}
function sday(g, days){
  const m = g.m; if (!g.short || (m.kind === 'rate' && !m.n) || m.u === 'n') return '';
  if (!(days > 0)) return '<span class="mut">month over</span>';
  const f = d => m.u === '$' ? '$' + Math.round(d).toLocaleString() : d.toFixed(1), need = f(g.units / days) + '/day';
  if (g.fut) { const per = g.units / days, share = g.fut.dPer > 0 ? per / g.fut.dPer : NaN;
    return `<b>${per.toFixed(1)}/day</b><small>from ~${Math.round(g.fut.dPer)} ${m.d === 'rebiztraffic' ? 'traffic' : 'opportunities'} a day (${pctTxt(share)} of them) · so far ${g.fut.nPer.toFixed(1)}/day</small>${share > 1 ? '<small style="color:var(--q5)">More than the expected daily volume</small>' : ''}`; }
  return g.pace ? `<b>${f(g.today)} today</b><small>avg ${need} · so far ${f(g.dayNow)}/day</small>` : need;
}

/* ----- daily index (data_11) and monthly targets (data_12) -----
   The daily index says what share of the month's target falls on each day (all days add up to 100%).
   Day target = month target x that day's index. Each metric follows one index column (editable). */
const IDX_DEFAULT = {pp: 'postpaidactivationstarget', bans: 'postpaidactivationstarget', hsi: 'postpaidactivationstarget', bb: 'postpaidactivationstarget', acc: 'netaccessorydollartarget'};
const imapOf = k => (S.imap && k in S.imap) ? S.imap[k] : IDX_DEFAULT[k] || '';
const idxColName = c => (S.idx && S.idx.names && S.idx.names[c]) || c;
// Daily weights for one metric and store: array of dim numbers that add up to 1 (even split if no index)
function idxWeights(m, id, dc){
  const ym = dc.rep.getFullYear() + '-' + pad(dc.rep.getMonth() + 1), col = imapOf(m.k), X = S.idx;
  const flat = Array(dc.dim).fill(1 / dc.dim);
  if (!X || X.ym !== ym || !col) return {w: flat, src: 'even'};
  const days = (X.stores && X.stores[id]) || X.all; if (!days) return {w: flat, src: 'even'};
  const w = Array.from({length: dc.dim}, (_, i) => +((days[i + 1] || {})[col]) || 0), s = w.reduce((a, b) => a + b, 0);
  return s > 0 ? {w: w.map(x => x / s), src: X.stores && X.stores[id] ? 'store' : 'all'} : {w: flat, src: 'even'};
}
const cumW = (w, d) => w.slice(0, Math.max(0, Math.min(d, w.length))).reduce((a, b) => a + b, 0);
function monthlyFor(id, m){
  const r = S.monthly && S.monthly.rows && S.monthly.rows[id]; if (!r || !m.mt) return null;
  if (!m.mt.every(k => isFinite(+r.v[k]))) return null;
  return m.mt.reduce((s, k) => s + +r.v[k], 0);
}

/* ----- report dates: the math runs from the day the data is through, not the day it was posted -----
   DCS and DORT can be through different days; the earlier one is used so nothing is counted twice.
   Days between the report date and today are filled in at the store's current daily pace. */
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const a = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return a ? new Date(+a[1], +a[2] - 1, +a[3], 12) : null; };
const niceDay = d => d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
function dctx(){
  const SD = S.sales, now = new Date(); now.setHours(12, 0, 0, 0);

      if (v) METRICS.forEach(x => ratio[x.k] = qr.m[x.k][0] ? v[x.k] / qr.m[x.k][0] : 1);

  }
  const dc = dctx(), toDate = (S.sales.tmode || 'todate') === 'todate';
  const list = SALES.map(m => {

    const cur = sval(row.v, m), b0 = sbase(row, m), pace = m.kind === 'tgt' && !m.trend && m.u !== 'n';
    const W = pace ? idxWeights(m, row.id, dc) : null, w = W ? W.w : null;

    const base = mon != null ? mon : pace && toDate && cR > 0 ? b0 / cR : b0;
    const tSrc = mon != null ? 'monthly' : pace && toDate ? 'scaled' : 'report';

function parseSales(grid){
  const hi = grid.findIndex(r => r && r.some(c => norm(c) === 'saplocation'));
  if (hi < 0) throw new Error('No header row with "Sap: Location" found.');
  const H = grid[hi].map(norm), loc = H.indexOf('saplocation'), dc = H.indexOf('district');
  const rows = []; let district = null, label = null;
  for (const r of grid.slice(hi + 1)) {

    const a = s.match(/^([^:]+):\s*(.+)$/);

    const other = e.target.type === 'range' ? $('tn-' + k) : $('tr-' + k);
    if (other.type === 'range' && v > +other.max) other.max = Math.ceil(v * 1.2); other.value = v; upd(); };
  const setAll = f => { items.forEach(it => { const st = it.g.m.u === '$' ? 1 : 10; ui.tx[key(it.g.m.k)] = Math.round(f(it) * st) / st; }); renderToday(); };
  $('tNorm').onclick = () => setAll(it => it.M0.normX);
  $('tPlan').onclick = () => setAll(it => it.g.short ? it.M0.planX : it.M0.normX);
  $('tStore').onchange = e => { ui.gstore = ui.store = e.target.value; saveUI(); render(); };
  upd();
}

/* ---------- 9. START-UP + ROUTING ---------- */
function fillFilters(){
  const ms = months(); if (!ms.includes(ui.month)) ui.month = ms[0] || '';
  $('fMonth').innerHTML = ms.map(m => `<option>${esc(m)}</option>`).join(''); $('fMonth').value = ui.month;
  const stores = [...new Map(S.rows.map(r => [r.id, r.store])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (!stores.some(s => s[0] === ui.store)) ui.store = (rowsFor(ui.month)[0] || {}).id || '';
  $('fStore').innerHTML = stores.map(([id, nm]) => `<option value="${esc(id)}">${esc(nm)} (${esc(id)})</option>`).join(''); $('fStore').value = ui.store;
}
function render(){
  $('boot')?.remove();
  const tab = ['overview', 'store', 'gaps', 'today', 'data'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  fillFilters();
  document.querySelectorAll('.tabs a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  if (tab === 'overview') renderOverview(); else if (tab === 'store') renderStore(); else if (tab === 'gaps') renderGaps(); else if (tab === 'today') renderToday(); else renderData();
}
$('fMonth').onchange = e => { ui.month = e.target.value; whatif = null; saveUI(); render(); };
$('fStore').onchange = e => openStore(e.target.value);
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card.click')) openStore(e.target.dataset.id); });
$('loginForm').onsubmit = e => { e.preventDefault(); setPw($('pw').value, $('remember').checked); boot(); };
$('loginCancel').onclick = () => { wantEdit = false; hideLogin(); };
$('acct').onclick = () => {
  if (role === 'edit') { setPw(''); role = 'view'; wantEdit = false; toast('Signed out'); boot(); }
  else { wantEdit = true; showLogin('Enter the edit password.', true); }
};
boot();
}
